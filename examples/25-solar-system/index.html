<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar system · connect-ai-three</title>
<style>
:root { --ink: #eef1f8; --dim: rgba(226, 232, 245, .58); --line: rgba(255, 255, 255, .12); --glass: rgba(12, 14, 24, .56); --accent: #ffc27a; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--ink); font: 13px/1.4 -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
canvas { display: block; }
.title { position: fixed; left: max(28px, 5vw); top: max(24px, 5vh); pointer-events: none; z-index: 5; }
.title b { display: block; font: 400 clamp(24px, max(2.6vw, 2.1vh), 46px)/1 Georgia, "Times New Roman", serif; letter-spacing: .16em; text-shadow: 0 2px 22px rgba(0, 0, 0, .6); }
.title i { display: block; margin-top: .7em; font: 500 clamp(10px, max(.8vw, .75vh), 14px)/1.4 system-ui, sans-serif; font-style: normal; letter-spacing: .24em; text-transform: uppercase; color: var(--dim); }
.mark { position: fixed; right: max(16px, 5vw); bottom: max(14px, 5vh); font: 600 11px/1 system-ui, sans-serif; letter-spacing: .2em; color: rgba(255, 255, 255, .78); pointer-events: none; z-index: 5; }

/* the HUD: one glass bar at the bottom, the date on the right of the title */
#hud { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); width: min(980px, calc(100vw - 32px)); z-index: 6;
  display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; padding: 12px 18px;
  background: var(--glass); border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3);
  box-shadow: 0 18px 50px rgba(0, 0, 0, .45); }
#play { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255, 255, 255, .06); color: var(--ink); cursor: pointer; display: grid; place-items: center; }
#play:hover { background: rgba(255, 255, 255, .12); }
.time { display: grid; gap: 6px; }
.time .row { display: flex; justify-content: space-between; color: var(--dim); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.time .row span:last-child { color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: .02em; text-transform: none; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) var(--fill, 40%), rgba(255, 255, 255, .16) var(--fill, 40%)); outline: none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(255, 194, 122, .25); cursor: pointer; }
.toggles { display: flex; gap: 6px; }
.toggles button, .chips button { border: 1px solid var(--line); background: rgba(255, 255, 255, .04); color: var(--dim); border-radius: 999px; padding: 6px 11px; font: 500 11px/1 system-ui, sans-serif; letter-spacing: .06em; cursor: pointer; }
.toggles button[aria-pressed=true], .chips button[aria-pressed=true] { color: #1a1205; background: var(--accent); border-color: transparent; }
.chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
#date { position: fixed; right: max(16px, 5vw); top: max(24px, 5vh); text-align: right; z-index: 5; pointer-events: none; }
#date b { display: block; font: 300 clamp(18px, 1.8vw, 28px)/1 system-ui, sans-serif; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
#date i { font-style: normal; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
#labels { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
#labels div { position: absolute; transform: translate(10px, -50%); font: 500 11px/1 system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: rgba(255, 255, 255, .72); white-space: nowrap; }
#labels div::before { content: ""; position: absolute; left: -10px; top: 50%; width: 6px; height: 1px; background: rgba(255, 255, 255, .5); }
@media (max-width: 640px) { #hud { grid-template-columns: auto 1fr; bottom: 12px; } .toggles { grid-column: 1 / -1; } .mark { display: none; } #date { top: auto; bottom: 190px; } }
/* filming: no HUD, no labels (the kit sets window.__FILM__ before the page runs) */
body.film #hud, body.film #labels, body.film #date { display: none !important; }
</style>
<script type="importmap">
{ "imports": { "three": "../_three/build/three.module.js", "three/addons/": "../_three/examples/jsm/" } }
</script>
</head>
<body>
<div class="title"><b>THE SOLAR SYSTEM</b><i>Eight planets on their real orbits, sped up</i></div>
<div id="date"><b id="dateText">2026-11-28</b><i>simulated date</i></div>
<div id="labels"></div>
<div id="hud" role="region" aria-label="Simulation controls">
  <button id="play" type="button" aria-label="Pause">
    <svg id="icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
  </button>
  <label class="time">
    <span class="row"><span>Time speed</span><span id="speedText">10 days / s</span></span>
    <input id="speed" type="range" min="0" max="1000" value="561" aria-label="Time speed">
  </label>
  <div class="toggles">
    <button id="tOrbits" type="button" aria-pressed="true">Orbits</button>
    <button id="tLabels" type="button" aria-pressed="true">Labels</button>
  </div>
  <div class="chips" id="chips" aria-label="Focus"></div>
</div>
<div class="mark" data-keep>CONNECT AI LAB</div>
<script type="module" src="./main.js"></script>
</body>
</html>
