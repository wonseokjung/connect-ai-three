<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dragon film · connect-ai-three</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#cfd6e4;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
  #c{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:pointer}
  #hint{position:fixed;right:22px;bottom:20px;width:26px;height:26px;opacity:0;transition:opacity 1.2s;pointer-events:none}
  #hint svg{width:100%;height:100%;fill:none;stroke:#dfe6f2;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px #000)}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;transition:opacity 1.2s}
  #load i{width:34px;height:34px;border-radius:50%;border:2px solid #2a3140;border-top-color:#ffb070;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #err{position:fixed;left:8px;top:8px;font:11px/1.35 ui-monospace,Menlo,monospace;color:#ff8a7a;white-space:pre-wrap;max-width:70vw;pointer-events:none}
  #bar{position:fixed;left:0;bottom:0;height:2px;width:0;background:linear-gradient(90deg,#6fb4ff,#ff8a3c);opacity:.0;transition:opacity .6s}
  body.paused #bar, body.dbg #bar{opacity:.8}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></div>
<div id="bar"></div>
<div id="load"><i></i></div>
<div id="err"></div>
<script type="importmap">
{ "imports": { "three": "../_three/build/three.module.js", "three/addons/": "../_three/examples/jsm/" } }
</script>
<script type="module" src="./boot.js"></script>
</body>
</html>
